name: affichage-billetterie

services:
  dashboard:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_DOCKER_NETWORK:?TRAEFIK_DOCKER_NETWORK is required}"
      traefik.http.routers.affichage-billetterie-http.rule: "Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)"
      traefik.http.routers.affichage-billetterie-http.entrypoints: "${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      traefik.http.routers.affichage-billetterie-http.middlewares: "affichage-billetterie-redirect@docker"
      traefik.http.middlewares.affichage-billetterie-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.affichage-billetterie-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.affichage-billetterie-https.rule: "Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)"
      traefik.http.routers.affichage-billetterie-https.entrypoints: "${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      traefik.http.routers.affichage-billetterie-https.tls: "true"
      traefik.http.routers.affichage-billetterie-https.tls.certresolver: "${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER is required}"
      traefik.http.routers.affichage-billetterie-https.service: "affichage-billetterie"
      traefik.http.services.affichage-billetterie.loadbalancer.server.port: "3000"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_DOCKER_NETWORK:?TRAEFIK_DOCKER_NETWORK is required}
